<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Five on Line</title>
    <script type="text/javascript" src="jquery-3.2.1.min.js"></script>
</head>
<style>
    * {
        padding: 0px;
        margin: 0px;
    }

    body {
        padding-top: 0;
        background-color: #000;
    }

    /* 基础可缩放字号（供 rem 使用；当前主要直接为元素设置 clamp） */
    html { font-size: clamp(12px, 1.6vmin, 16px); }

    .box {
        position: relative;
    }

    .box.left {
        width: 25%;
        margin: 0 auto;
    }

    .box.middle {
        width: 50%;
    }

    .box.right {
        width: 25%;
    }

    /* 外层容器：垂直居中三列主体 */
    #app {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
    }
    #app .layout {
        display: flex;
        width: 100%;
        max-width: 180vmin; /* 受限于较小的视窗维度，矮屏时整体自动收缩 */
        margin: 0 auto;
    }

    /* 小屏（宽度 <= 500px）单列布局与内容调整 */
    @media (max-width: 430px) {
        #app .layout {
            flex-direction: column;
            max-width: 100%;
        }
        .box.left, .box.middle, .box.right { width: 100%; }
        .box.left { order: 1; }
        .box.middle { order: 2; }
        .box.right { order: 3; }
        /* 左侧 cute 隐藏 */
        #cute { display: none !important; }
        /* 左侧“下一步”三个格子横向平铺占满 */
        .box.left .main { width: 100%; margin-top: 1vmin; }
        .box.left .main div { flex: 0 0 33.333333%; }
    }

    .main {
        box-sizing: border-box;
        padding: 0.2%;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        align-items: center;
        background-color: #ccc;
        border: 3px solid;
        border-color: #fff #000 #000 #fff;
    }

    .score {
        width: 60%;
        height: 8vmin;
        margin: 0 auto;
        box-sizing: border-box;
        padding: 0.2%;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-content: center;
        align-items: center;
        background-color: black;
        border: 3px solid;
        border-color: #ffffff;
    }

    .main div {
        box-sizing: border-box;
        background-color: #cccccc;
        border: 3px solid;
        border-color: #fff #000 #000 #fff;
        flex-shrink: 1;
    }

    .box.left .main {
        width: 60%;
        height: auto; /* 由子项的正方形比例自然撑开 */
        margin: 0 auto;
    }

    .box.left .main div {
        flex: 0 0 33.333333%;
        height: auto;
        aspect-ratio: 1 / 1; /* 始终正方形 */
    }

    .box.left .main div::after {
        display: block;
        content: "";
        width: 80%;
        height: auto;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        margin: 10% auto;
        border: 1px solid #000000;
        box-shadow: inset -5px -4px 16px 1px black;
    }

    .box.left h3 {
        font-family: "Weibei SC";
        text-align: center;
        color: white;
        margin: 1vw auto 0.5vw auto;
        font-size: clamp(14px, 2.2vmin, 22px);
    }

    .box.left h2 {
        text-align: center;
        color: white;
        margin: 1vw auto 0.5vw auto;
        font-size: clamp(18px, 3.6vmin, 44px);
    }

    .box.middle .main {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1; /* 保持棋盘正方形 */
        margin: 1vmin auto 0 auto;
        position: relative; /* 承载浮动棋子 */
    }

    .box.middle .main div {
        flex-basis: 11.11111111%;
        height: 11.11111111%;
    }

    .box.middle .main div:not(.floating-ball)::after {
        display: block;
        content: "";
        width: 80%;
        height: auto;
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        margin: 10% auto;
        border: 1px solid #000000;
        box-shadow: inset -5px -4px 16px 1px rgba(0,0,0,0.85), 0 16px 24px 2px rgba(0, 0, 0, 0.14), 0 6px 30px 5px rgba(0, 0, 0, 0.12), 0 8px 10px -5px rgba(0, 0, 0, 0.3);
    }

    /* 禁止浮动棋子生成伪元素，避免被通配 ::after 污染 */
    .floating-ball::after { content: none !important; display: none !important; }

    @keyframes onclicked {
        0% {
            transform: translate(0px, 0px);
        }
        50% {
            transform: translate(0px, -10px);
        }
        100% {
            transform: translate(0px, 0px);
        }
    }

    @-moz-keyframes onclicked {
        0% {
            transform: translate(0px, 0px);
        }
        50% {
            transform: translate(0px, -10px);
        }
        100% {
            transform: translate(0px, 0px);
        }
    }

    @-webkit-keyframes onclicked {
        0% {
            transform: translate(0px, 0px);
        }
        50% {
            transform: translate(0px, -10px);
        }
        100% {
            transform: translate(0px, 0px);
        }
    }

    @-o-keyframes onclicked {
        0% {
            transform: translate(0px, 0px);
        }
        50% {
            transform: translate(0px, -10px);
        }
        100% {
            transform: translate(0px, 0px);
        }
    }

    @keyframes appear {
        0% {
            width: 20%;
            height: 1vw;;
        }
        50% {
            width: 40%;
            height: 2vw;
        }
        100% {
            width: 80%;
            height: 4vw;
        }
    }

    .empty::after {
        opacity: 0;
    }

    .red::after {
        background-color: red;
    }

    .yellow::after {
        background-color: #ffea00;
    }

    .blue::after {
        background-color: blue;
    }

    .brown::after {
        background-color: saddlebrown;
    }

    .pink::after {
        background-color: #f48fb1;
    }

    .skyblue::after {
        background-color: #18ffff;
    }

    .greenyellow::after {
        background-color: #64dd17;
    }

    .box.middle .main div.clicked {
        background-color: #6e6e6e;
        border-color: #3c3c3c;

        /*animation: onclicked 1s infinite;*/
        /*-moz-animation: onclicked 1s infinite;*/
        /*-webkit-animation: onclicked 1s infinite;*/
        /*-o-animation: onclicked 1s infinite;*/
    }

    .appeared::after {
        animation: appear 1s;
    }

    #cute {
        margin: 3vmin auto;
        width: 80%;
        height: 35vmin;
        background-image: url("cute.jpg");
        background-size: 100% 100%;
    }

    #probability {
        width: 80%;
        margin: 2vmin auto;
        color: white;
    }

    #probability tr td {
        font-size: clamp(12px, 6vmin, 38px);
        padding: 1vmin 1vmin;
        border: 2px solid;
        border-color: white;
        text-align: right;
    }

    #probability tr td div::after {
        display: block;
        content: "";
        width: 6vmin;
        height: 6vmin;
        border-radius: 50%;
        margin: 10% auto;
        border: 1px solid #fff;
        box-shadow: inset -5px -4px 16px 1px black;
    }

    /* 浮动移动用的棋子（覆盖在棋盘上层） */
    .floating-ball {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        border: 1px solid #000000;
        /* 外环同棋盘底色，遮住格子高光边，避免肉眼看到白边 */
        box-shadow: 0 0 0 3px #cccccc, inset -5px -4px 16px 1px rgba(0,0,0,0.85), 0 16px 24px 2px rgba(0, 0, 0, 0.14), 0 6px 30px 5px rgba(0, 0, 0, 0.12), 0 8px 10px -5px rgba(0, 0, 0, 0.3);
        background-clip: padding-box;
        pointer-events: none;
        z-index: 10000;
        transform: translate(0, 0) translateZ(0);
        will-change: transform;
        contain: paint;
        transition: transform 120ms linear;
    }
    .floating-ball.red { background-color: red; }
    .floating-ball.yellow { background-color: #ffea00; }
    .floating-ball.blue { background-color: blue; }
    .floating-ball.brown { background-color: saddlebrown; }
    .floating-ball.pink { background-color: #f48fb1; }
    .floating-ball.skyblue { background-color: #18ffff; }
    .floating-ball.greenyellow { background-color: #64dd17; }

    .modal {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        z-index: 9999;
    }

    .modal .modal-body {
        box-sizing: border-box;
        padding: 2vw 1vw;
        text-align: center;
        width: 20%;
        height: 20vw;
        background-color: white;
        margin: 8vw auto;
        border: 1px solid #3c3c3c;
        border-radius: 5%;
        font-size: clamp(12px, 1.8vmin, 16px);
    }

    .modal .modal-body h2 { font-size: clamp(16px, 2.8vmin, 28px); }
    .modal .modal-body p { font-size: clamp(12px, 1.8vmin, 16px); }

    .modal .modal-body button {
        display: block;
        width: 60px;
        height: 30px;
        border-radius: 5%;
        outline: none;
        margin: 0 auto;
        font-size: clamp(12px, 1.8vmin, 16px);
    }

    .box.right button {
        display: block;
        width: 60px;
        height: 30px;
        border-radius: 5%;
        outline: none;
        margin: 0 auto;
        font-size: clamp(12px, 1.8vmin, 16px);
    }
</style>
<body>
<div id="app">
<div class="layout">
<div class="box left">
    <h3>下一步</h3>
    <div class="main">
        <div id="next_1" class="red"></div>
        <div id="next_2" class="empty"></div>
        <div id="next_3" class="empty"></div>
    </div>
    <h3>分数</h3>
    <div class="score">
        <h2 id="score">0</h2>
    </div>
    <h3 id="dname">正常难度最高分</h3>
    <div class="score">
        <h2 id="maxscore">0</h2>
    </div>
    <div id="cute"></div>
</div>
<div class="box middle">
    <div class="main"></div>
</div>
<div class="box right">
    <table id="probability">
        <tr>
            <td>
                <div class="red"></div>
            </td>
            <td id="red_probability">0%</td>

        </tr>
        <tr>
            <td>
                <div class="yellow"></div>
            </td>
            <td id="yellow_probability">0%</td>

        </tr>
        <tr>
            <td>
                <div class="brown"></div>
            </td>
            <td id="brown_probability">0%</td>

        </tr>
        <tr>
            <td>
                <div class="skyblue"></div>
            </td>
            <td id="skyblue_probability">0%</td>

        </tr>
        <tr>
            <td>
                <div class="pink"></div>
            </td>
            <td id="pink_probability">0%</td>

        </tr>
        <tr>
            <td>
                <div class="greenyellow"></div>
            </td>
            <td id="greenyellow_probability">0%</td>

        </tr>
        <tr>
            <td>
                <div class="blue"></div>
            </td>
            <td id="blue_probability">0%</td>

        </tr>
    </table>
    <button onclick="showSetting()">设置难度</button>
</div>
</div>
</div>
<div class="modal" id="setting" hidden>
    <div class="modal-body">
        <h2>设置</h2>
        <br>
        <p>难度</p>
        <p style="color: #aaa">更改难度后游戏会重新开始</p>
        <br>
        <input type="radio" name="difficulty" value="1">最简单&nbsp;
        <input type="radio" name="difficulty" value="2" checked>正常&nbsp;
        <input type="radio" name="difficulty" value="3">最困难&nbsp;
        <br>
        <br>
        <button onclick="setDifficulty()">确认</button>
    </div>
</div>
</body>
<script type="text/javascript">
    var colors = ["red", "yellow", "brown", "skyblue", "pink", "greenyellow", "blue"];
    var turns = 0;
    var board = new Array();
    var pointlist = new Array();
    var pointway = new Array();
    var score = 0;
    var lastcount = 81;
    var difficulty = 2;
    var isAnimating = false; // 是否正在执行移动动画，避免并发点击
    var moveStepMs = 60; // 每一步动画间隔（毫秒）
    var useSmoothAnimation = true; // 使用平滑移动动画

    function init() {
        turns = 0;
        lastcount = 81;
        score = 0;
        setScore(0);
        if (localStorage.max == null)
            localStorage.max = 0;
        if (localStorage.easy == null)
            localStorage.easy = 0;
        if (localStorage.hard == null)
            localStorage.hard = 0;
        if (difficulty == 1)
            $("#maxscore").text(localStorage.easy);
        else if (difficulty == 2)
            $("#maxscore").text(localStorage.max);
        else
            $("#maxscore").text(localStorage.hard);
        pointlist = new Array();
        pointway = new Array();
        for (var i = 0; i < 9; i++) {
            board[i] = new Array();
            for (var j = 0; j < 9; j++) {
                board[i][j] = 0;
            }
        }
        getNext();
        var main = document.getElementsByClassName("main")[1]
        var str = "";
        for (var i = 0; i < 9; i++) {
            for (var j = 0; j < 9; j++) {
                str = str + "<div id='" + i + j + "' class='empty'></div>"
            }
        }
        main.innerHTML = str;
        setNext();
        getNext();
    }

    function setDifficulty() {
        var d = $("input[name='difficulty']:checked").val();
        if (d != difficulty) {
            difficulty = d;
            if (difficulty == 1)
                $("#dname").text("简单难度最高分");
            else if (difficulty == 2)
                $("#dname").text("正常难度最高分");
            else
                $("#dname").text("困难难度最高分");
            init();
        }
        $("#setting").fadeOut("fast");
    }

    function showSetting() {
        $("#setting").fadeIn("fast");
    }

    function setScore(count) {
        var temp = 2;
        for (var i = 1; i <= count; i++) {
            if (i > 6)
                temp += 4;
            score += temp;
        }
        var s = document.getElementById("score");
        $(s).text(score)
        if (score > $("#maxscore").text())
            $("#maxscore").text(score);
    }

    $(function () {
        init();
    });

    function getNext() {
        var count = 0;
        turns++;
        if (difficulty == 1)
            count == 1;
        else if (difficulty == 2) {
            if (turns <= 100)
                count = 4;
            else if (turns <= 200)
                count = 5;
            else if (turns <= 300)
                count = 6;
            else
                count = 7;
        }
        else
            count = 7;
        for (var i = 1; i <= 3; i++) {
            var color = Math.floor(Math.random() * count);
//            color = 0;
            var nextbox = document.getElementById("next_" + i);
            $(nextbox).removeClass().addClass(colors[color]);
        }
    }

    function setNext() {
        var x, y;
        var temp = 3;
        if (lastcount < temp) {
            temp = lastcount;
        }
        for (var i = 1; i <= temp; i++) {
            var flag = false;
            var nextbox = document.getElementById("next_" + i);
            var color = nextbox.className;
            while (!flag) {
                x = Math.floor(Math.random() * 9);
                y = Math.floor(Math.random() * 9);
                if (board[x][y] == 0)
                    flag = true;
            }
            board[x][y] = colors.indexOf(color) + 1;
        }
        for (var i = 0; i < 9; i++) {
            for (var j = 0; j < 9; j++) {
                if (board[i][j] != 0) {
                    var count = isVectory(i, j, board[i][j]);
                    setScore(count);
                }
            }
        }
        showBoard();
        if (lastcount <= 0)
            gameOver();

    }

    function gameOver() {
        var str = "游戏结束!";
        if (difficulty == 1) {
            if (score > localStorage.nomal) {
                str = str + "新的最高分：" + score + "!";
                localStorage.nomal = score;
            }
        } else if (difficulty == 2) {
            if (score > localStorage.max) {
                str = str + "新的最高分：" + score + "!";
                localStorage.max = score;
            }
        } else {
            if (score > localStorage.hard) {
                str = str + "新的最高分：" + score + "!";
                localStorage.hard = score;
            }
        }
        alert(str);
        init();
    }

    function showBoard() {
        lastcount = 81;
        var count = new Array();
        for (var i = 0; i < 8; i++)
            count[i] = 0;
        for (var i = 0; i < 9; i++) {
            for (var j = 0; j < 9; j++) {
                var id = "" + i + j;
                var boardbox = document.getElementById(id);
                if (board[i][j] == 0)
                    $(boardbox).removeClass().addClass("empty");
                else {
                    lastcount--;
                    count[0]++;
                    count[board[i][j]]++;
                    var color = colors[board[i][j] - 1];
                    $(boardbox).removeClass().addClass(color);
                }
            }
        }
        for (var i = 1; i < 8; i++) {
            var p = count[i] / count[0];
            var color = colors[i - 1];
            var pbox = document.getElementById(color + "_probability");
            pbox.innerHTML = count[i] + "<span style='color: #ddd'>(" + p.toFixed(2) + "%)</span>";
        }
    }

    function isVectory(x, y, color) {
        var flag = 0;
        var a, b;
        for (a = x - 4; a <= x + 4; a++) {
            for (var i = 0; i <= 4; i++) {
                if (a + i < 0 || a + i > 8)
                    break;
            }
            if (i != 5)
                continue;
            if (board[a][y] == color && board[a + 1][y] == color && board[a + 2][y] == color && board[a + 3][y] == color && board[a + 4][y] == color) {
                var temp = 1;
                while (a - temp >= 0 && board[a - temp][y] == color) {
                    if (a - temp != x) {
                        board[a - temp][y] = 0;
                        flag++;
                    }
                    temp++;
                }
                temp = 1;
                while (a + temp <= 8 && board[a + temp][y] == color) {
                    if (a + temp != x) {
                        board[a + temp][y] = 0;
                        flag++;
                    }
                    temp++;
                }
                if (a != x) {
                    board[a][y] = 0;
                    flag++;
                }
            }
        }
        for (b = y - 4; b <= y + 4; b++) {
            for (var i = 0; i <= 4; i++) {
                if (b + i < 0 || b + i > 8)
                    break;
            }
            if (i != 5)
                continue;
            if (board[x][b] == color && board[x][b + 1] == color && board[x][b + 2] == color && board[x][b + 3] == color && board[x][b + 4] == color) {
                var temp = 1;
                while (b - temp >= 0 && board[x][b - temp] == color) {
                    if (b - temp != y) {
                        flag++;
                        board[x][b - temp] = 0;
                    }
                    temp++;
                }
                temp = 1;
                while (b + temp <= 8 && board[x][b + temp] == color) {
                    if (b + temp != y) {
                        flag++;
                        board[x][b + temp] = 0;
                    }
                    temp++;
                }
                if (b != y) {
                    flag++;
                    board[x][b] = 0;
                }
            }
        }
        for (a = x - 4, b = y - 4; a <= x + 4; a++, b++) {
            for (var i = 0; i <= 4; i++) {
                if (a + i < 0 || a + i > 8 || b + i < 0 || b + i > 8)
                    break;
            }
            if (i != 5)
                continue;
            if (board[a][b] == color && board[a + 1][b + 1] == color && board[a + 2][b + 2] == color && board[a + 3][b + 3] == color && board[a + 4][b + 4] == color) {
                var temp = 1;
                while (a - temp >= 0 && b - temp >= 0 && board[a - temp][b - temp] == color) {
                    if (a - temp != x && b - temp != y) {
                        flag++;
                        board[a - temp][b - temp] = 0;
                    }
                    temp++;
                }
                temp = 1;
                while (a + temp <= 8 && b + temp <= 8 && board[a + temp][b + temp] == color) {
                    if (a + temp != x && b + temp != y) {
                        flag++;
                        board[a + temp][b + temp] = 0;
                    }
                    temp++;
                }
                if (a != x && b != y) {
                    flag++;
                    board[a][b] = 0;
                }
            }
        }
        for (a = x - 4, b = y + 4; a <= x + 4; a++, b--) {
            for (var i = 0; i <= 4; i++) {
                if (a + i < 0 || a + i > 8 || b - i < 0 || b - i > 8)
                    break;
            }
            if (i != 5)
                continue;
            if (board[a][b] == color && board[a + 1][b - 1] == color && board[a + 2][b - 2] == color && board[a + 3][b - 3] == color && board[a + 4][b - 4] == color) {
                var temp = 1;
                while (a - temp >= 0 && b + temp <= 8 && board[a - temp][b + temp] == color) {
                    if (a - temp != x && b + temp != y) {
                        flag++;
                        board[a - temp][b + temp] = 0;
                    }
                    temp++;
                }
                temp = 1;
                while (a + temp <= 8 && b - temp >= 0 && board[a + temp][b - temp] == color) {
                    if (a + temp != x && b - temp != y) {
                        flag++;
                        board[a + temp][b - temp] = 0;
                    }
                    temp++;
                }
                if (a != x && b != y) {
                    flag++;
                    board[a][b] = 0;
                }
            }
        }
        if (flag != 0) {
            flag++;
            board[x][y] = 0;
        }
        return flag;
    }

    $(document).on("click", ".box.middle .main div", function () {//点击监听
        var id = this.id;
        if (isAnimating) return; // 动画过程中禁止操作
        if (board[id[0]][id[1]] != 0) {//当点击处是否为空白
            var lastclick = document.getElementsByClassName("clicked");
            if (lastclick.length != 0)
                $(lastclick[0]).removeClass("clicked");
            $(this).addClass("clicked");
        } else {
            var lastclick = document.getElementsByClassName("clicked");
            if (lastclick.length == 0)
                return;
            var movething = lastclick[0];
            var mid = $(movething).attr("id");
            // 使用最短路径（BFS）查找从 mid 到 id 的路径
            var path = findShortestPath(mid, id);
            if (!path || path.length === 0 && mid !== id) { // 无法到达
                alert("这颗棋子无法移动到那个位置");
                return false;
            }
            // 记录颜色并开始动画
            var color = board[mid[0]][mid[1]];
            $(movething).removeClass("clicked");
            if (useSmoothAnimation) {
                animateMoveSmooth(mid, path, color, function (endX, endY) {
                    var count = isVectory(endX, endY, color);
                    showBoard();
                    setScore(count);
                    if (count == 0) {
                        setNext();
                        getNext();
                    }
                });
            } else {
                animateMove(mid, path, color, function (endX, endY) {
                    var count = isVectory(endX, endY, color);//消除判断方法
                    showBoard();//棋盘重新布局
                    setScore(count);
                    if (count == 0) {
                        setNext();//添加下一轮的三颗棋子
                        getNext();//获取再下一轮的三颗棋子
                    }
                });
            }
        }
    });

    // 使用 BFS 计算最短路径（返回从起点到终点的坐标 id 数组，不包含起点，包含终点）
    function findShortestPath(startId, targetId) {
        if (startId === targetId) return [];
        var queue = [];
        var visited = {};
        var previous = {};
        queue.push(startId);
        visited[startId] = true;
        var dx = [-1, 0, 1, 0];
        var dy = [0, 1, 0, -1];
        while (queue.length > 0) {
            var cur = queue.shift();
            var x = parseInt(cur[0]);
            var y = parseInt(cur[1]);
            for (var i = 0; i < 4; i++) {
                var nx = x + dx[i];
                var ny = y + dy[i];
                if (nx < 0 || nx > 8 || ny < 0 || ny > 8) continue;
                var nid = "" + nx + ny;
                if (visited[nid]) continue;
                // 允许走到目标格；其他格必须为空
                if (nid !== targetId && board[nx][ny] !== 0) continue;
                visited[nid] = true;
                previous[nid] = cur;
                if (nid === targetId) {
                    // 回溯路径
                    var path = [];
                    var p = targetId;
                    while (p !== startId) {
                        path.unshift(p);
                        p = previous[p];
                    }
                    return path;
                }
                queue.push(nid);
            }
        }
        return null;
    }

    // 按最短路径执行逐步移动动画
    function animateMove(startId, path, color, onComplete) {
        isAnimating = true;
        var stepIndex = 0;
        function doStep() {
            var prevId = stepIndex === 0 ? startId : path[stepIndex - 1];
            var curId = path[stepIndex];
            var px = parseInt(prevId[0]);
            var py = parseInt(prevId[1]);
            var cx = parseInt(curId[0]);
            var cy = parseInt(curId[1]);
            // 清空上一格，填充当前格
            board[px][py] = 0;
            board[cx][cy] = color;
            showBoard();
            stepIndex++;
            if (stepIndex < path.length) {
                setTimeout(doStep, moveStepMs);
            } else {
                isAnimating = false;
                if (typeof onComplete === 'function') onComplete(cx, cy);
            }
        }
        // 如果没有任何步长（start==end），直接回调
        if (!path || path.length === 0) {
            isAnimating = false;
            if (typeof onComplete === 'function') {
                var sx = parseInt(startId[0]);
                var sy = parseInt(startId[1]);
                onComplete(sx, sy);
            }
            return;
        }
        doStep();
    }

    // 平滑动画：创建浮动棋子沿像素路径移动，避免每步重绘整个棋盘
    function animateMoveSmooth(startId, path, colorIdx, onComplete) {
        isAnimating = true;
        if (!path || path.length === 0) {
            isAnimating = false;
            if (typeof onComplete === 'function') {
                var sx = parseInt(startId[0]);
                var sy = parseInt(startId[1]);
                onComplete(sx, sy);
            }
            return;
        }
        // DOM 引用
        var $board = $(".box.middle .main");
        var boardEl = $board[0];
        var boardRect = boardEl.getBoundingClientRect();
        // 网格大小（每格宽高）
        var cellW = boardEl.clientWidth / 9;
        var cellH = boardEl.clientHeight / 9;
        var size = Math.min(cellW, cellH) * 0.8;

        // 起点和路径终点
        var sx = parseInt(startId[0]);
        var sy = parseInt(startId[1]);
        var ex = parseInt(path[path.length - 1][0]);
        var ey = parseInt(path[path.length - 1][1]);

        // 从棋盘移除原位置的球（逻辑层）并临时不重绘，避免闪烁
        var savedColor = board[sx][sy];
        board[sx][sy] = 0;
        showBoard();

        // 创建浮动球
        var colorClass = colors[savedColor - 1];
        var $float = $("<div class='floating-ball "+ colorClass +"'></div>");
        // 以内联样式强制隔离所有来自 `.main div` 的通用规则
        var colorMap = {
            red: 'red',
            yellow: '#ffea00',
            blue: 'blue',
            brown: 'saddlebrown',
            pink: '#f48fb1',
            skyblue: '#18ffff',
            greenyellow: '#64dd17'
        };
        var bg = colorMap[colorClass] || colorClass;
        $float.css({
            width: size + 'px',
            height: size + 'px',
            boxSizing: 'content-box',
            border: '1px solid #000',
            borderRadius: '50%',
            display: 'block',
            backgroundColor: bg,
            transition: 'transform ' + moveStepMs + 'ms linear'
        });
        $board.append($float);

        // 根据网格计算像素坐标（居中到格子内）
        function gridToTranslate(x, y) {
            var left = y * cellW + (cellW - size) / 2;
            var top = x * cellH + (cellH - size) / 2;
            return {left: left, top: top};
        }

        function setTranslate(pos) {
            $float.css('transform', 'translate(' + pos.left + 'px,' + pos.top + 'px)');
        }

        // 初始化位置为起点
        setTranslate(gridToTranslate(sx, sy));

        // 依次平滑移动到每个节点
        var idx = 0;
        function step() {
            if (idx >= path.length) {
                // 到达终点：写回逻辑层并清理浮动球
                var tx = parseInt(path[path.length - 1][0]);
                var ty = parseInt(path[path.length - 1][1]);
                board[tx][ty] = savedColor;
                $float.remove();
                isAnimating = false;
                if (typeof onComplete === 'function') onComplete(tx, ty);
                return;
            }
            var nx = parseInt(path[idx][0]);
            var ny = parseInt(path[idx][1]);
            setTranslate(gridToTranslate(nx, ny));
            idx++;
            // 与逐格动画时长保持接近（可根据需要调大/调小过渡时间）
            setTimeout(step, moveStepMs);
        }
        step();
    }

    function searchWay(xy, aim) {
        if (xy == aim)
            return true;
        pointlist.push(xy);
        var x = parseInt(xy[0]);
        var y = parseInt(xy[1]);
        var xd = [-1, 0, 1, 0];
        var yd = [0, 1, 0, -1];
        for (var i = 0; i < 4; i++) {
            var cx = x + xd[i];
            var cy = y + yd[i];
            if (cx < 0 || cx > 8 || cy < 0 || cy > 8)
                continue;
            var id = "";
            id = id + cx + cy;
            if (pointlist.indexOf(id) == -1 && board[cx][cy] == 0) {
                if (searchWay(id, aim)) {
                    pointway.push(id);
                    return true;
                }
            }
        }
        return false;
    }
</script>
